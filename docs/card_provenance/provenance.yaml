  # CMS binning is barrel<0.9 / overlap 0.9-1.2 / endcap 1.2-2.4 -> Delphes
  # 0.5/1.5/2.5 boundaries match nothing in the CMS paper.

  - param_id: CMS.MuonMomentumSmearing.eta0_05.a
    card: delphes_card_CMS.tcl
    module: MuonMomentumSmearing
    quantity: track_momentum_resolution_const_term
    object: muon
    eta_min: 0.0
    eta_max: 0.5
    functional_form: "sqrt(a^2 + (b*pt)^2)"
    role: a
    current_value: 0.010
    current_uncertainty: null
    source:
      collaboration: CMS
      title: "Performance of the CMS muon detector and muon reconstruction with proton-proton collisions at sqrt(s)=13 TeV"
      arxiv: "1804.04528"
      journal: "JINST 13 (2018) P06015"
      year: 2018
      locator: "Sec. 7.1: 'resolution for muons with momenta up to approximately 100 GeV is 1% in the barrel and 3% in the endcap'; uncertainty ~5% of value"
    extracted_value: 0.010
    extracted_uncertainty: 0.05      # relative, ~5% of value (quoted)
    uncertainty_type: total
    extraction_method: "barrel floor ~1% directly quoted; a=0.010 reproduces it exactly"
    matches_current: true
    verification:
      verified_by_independent_agent: true
      verifier_locator_agrees: true
      notes: "Confirmed verbatim (Sec 7.1) incl. ~5% uncertainty (Sec 7.1). Barrel floor exact."
    status: verified

