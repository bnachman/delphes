# Per-parameter provenance records (see provenance_schema.md).
#
# This file is the structured data store that backs the citable baseline +
# uncertainty cards and the JINST paper. One entry per coefficient.
#
# Status flow: audited -> sourced -> extracted -> verified -> applied.
# A record may only advance to `applied` once
# `verification.verified_by_independent_agent` is true. Records whose
# `matches_current` is false are surfaced for human review BEFORE any live card
# value is changed (no silent overwrites).
#
# ============================================================================
# BLOCK: Muon momentum resolution  (PILOT — first block taken end-to-end)
# Form in both cards: sigma(pt)/pt = sqrt(a^2 + (b*pt)^2), three |eta| regions.
# Source-mapped + extracted + independently re-verified (two cold verifier
# agents, both ACCEPT). Live card values are UNCHANGED in this pass; flagged
# discrepancies are recorded for the Phase-3 baseline/uncertainty cards.
# ============================================================================

records:

  # ----------------------- ATLAS muon resolution --------------------------
  # Functional form is verbatim ATLAS: sigma_ID/pt = a_ID(eta) (+) b_ID(eta)*pt
  # (quadratic sum), arXiv:1404.4562 Eq.(2). 13 TeV absolute anchors from
  # arXiv:1603.05598 Sec 8.2 (combined muons). NB: no ATLAS paper publishes the
  # (a,b) coefficients as a liftable per-eta table; ATLAS eta boundaries are
  # 1.05/1.7/2.0/2.5, so the Delphes 0.5 and 1.5 boundaries are a Delphes choice.

  - param_id: ATLAS.MuonMomentumSmearing.eta0_05.a
    card: delphes_card_ATLAS.tcl
    module: MuonMomentumSmearing
    quantity: track_momentum_resolution_const_term
    object: muon
    eta_min: 0.0
    eta_max: 0.5
    functional_form: "sqrt(a^2 + (b*pt)^2)"
    role: a
    current_value: 0.010
    current_uncertainty: null
    source:
      collaboration: ATLAS
      title: "Muon reconstruction performance of the ATLAS detector in pp collisions at sqrt(s)=13 TeV"
      arxiv: "1603.05598"
      journal: "Eur. Phys. J. C 76 (2016) 292"
      year: 2016
      locator: "Sec. 8.2 / Figs. 11-12 + abstract: central combined-muon pt resolution 1.7% (J/psi) and 2.3% (Z)"
    form_source:
      arxiv: "1404.4562"
      journal: "Eur. Phys. J. C 74 (2014) 3130"
      locator: "Eq. (2) (functional form); Figs. 17-18 (sigma/pt vs pt by eta)"
    extracted_value: 0.017          # measured central CB floor ~1.7% (J/psi scale)
    extracted_uncertainty: 0.05     # relative; ~5%-level resolution syst. (ATLAS scale syst ~0.05% abs)
    uncertainty_type: total
    extraction_method: "ATLAS-measured central CB resolution 1.7% (J/psi <pt>~10 GeV) / 2.3% (Z <pt>~45 GeV); Delphes a=0.010 -> ~1.0-1.1% across this range"
    matches_current: false          # FLAG: Delphes 1.0% too optimistic vs measured 1.7-2.3% (CB)
    verification:
      verified_by_independent_agent: true
      verifier_locator_agrees: true
      notes: "Cold verifier confirmed 1.7%/2.3% central CB verbatim (Sec 8.2, abstract). Caveat: anchors are combined muons; Delphes single-Gaussian maps most directly to ID-only Eq.(2). Direction of discrepancy robust either way."
    status: verified

  - param_id: ATLAS.MuonMomentumSmearing.eta0_05.b
    card: delphes_card_ATLAS.tcl
    module: MuonMomentumSmearing
    quantity: track_momentum_resolution_pt_term
    object: muon
    eta_min: 0.0
    eta_max: 0.5
    functional_form: "sqrt(a^2 + (b*pt)^2)"
    role: b
    current_value: 1.0e-4
    current_uncertainty: null
    source:
      collaboration: ATLAS
      title: "Muon reconstruction and identification efficiency in ATLAS using the full Run 2 pp collision data set at sqrt(s)=13 TeV"
      arxiv: "2012.00578"
      journal: "Eur. Phys. J. C 81 (2021) 578"
      year: 2021
      locator: "Fig. 2 (q/p resolution vs pt up to ~TeV, barrel |eta|<1.05)"
    extracted_value: 1.0e-4
    extracted_uncertainty: null     # high-pt term read off curve; ~1 percentage-pt plot-read uncertainty
    uncertainty_type: spread
    extraction_method: "Delphes gives ~10% at 1 TeV in barrel; consistent with 2012.00578 Fig.2 barrel curve and 1404.4562 Fig.17"
    matches_current: true
    verification:
      verified_by_independent_agent: true
      verifier_locator_agrees: true
      notes: "High-pt barrel magnitude (~10% at 1 TeV) consistent; b-term shape matches ATLAS a(+)b*pt form."
    status: verified

