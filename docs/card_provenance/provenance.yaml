      verifier_locator_agrees: true
      notes: "Direction/magnitude consistent. Caveat: ATLAS uses pt/tan^2(theta) for |eta|>2.0 (Eq.2 variant) which Delphes' simple form does not replicate; endcap high-pt (1 TeV) point not directly measured."
    status: verified

  # ------------------------- CMS muon resolution --------------------------
  # Floors from arXiv:1804.04528 Sec 7.1 ("1% barrel / 3% endcap up to ~100 GeV",
