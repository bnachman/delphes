      title: "Muon reconstruction efficiency and momentum resolution of the ATLAS experiment in pp collisions at sqrt(s)=7 TeV in 2010"
      arxiv: "1404.4562"
      journal: "Eur. Phys. J. C 74 (2014) 3130"
      year: 2014
      locator: "Eq.(2) note (b_MS ~0.4 TeV^-1 in CSC region |eta|>2.0) + Figs. 17-18; high-pt curve in 2012.00578 Fig. 2 (endcap)"
    extracted_value: 3.5e-4
    extracted_uncertainty: null
    uncertainty_type: spread
    extraction_method: "larger b encodes faster endcap high-pt degradation; consistent with ATLAS b_MS~0.4 TeV^-1 and 1/tan^2(theta) enhancement for |eta|>2.0"
    matches_current: true
    verification:
